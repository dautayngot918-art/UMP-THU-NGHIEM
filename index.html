.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.fh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}

const isChoice=f=>f.t==="radio"||f.t==="multi";
const isEmpty=v=>v==null||v===""||(Array.isArray(v)&&!v.length);
function vals(doc,form){return Object.assign({},doc&&doc[form]||{},{medical_record:doc&&doc.medical_record,study_id:doc&&doc.study_id});}
function fieldState(f,v){
  if(f.t==="key") return "ok";
  if(f.when&&!f.when(v)) return "na";
  if(f.optional) return isEmpty(v[f.k])?"opt":"ok";
  const x=v[f.k];
  if(isEmpty(x)) return isChoice(f)?"ch":"in";
  if(f.other&&(x===OTHER||(Array.isArray(x)&&x.includes(OTHER)))&&isEmpty(v[f.k+"_other"])) return "ot";
  return "ok";
}
function missing(doc,form){
  const v=vals(doc,form), out=[]; let req=0, done=0;
  for(const s of FORMS[form].sections){
    const sm={id:s.id,t:s.t,items:[],req:0};
    for(const f of s.fields){
      const st=fieldState(f,v);
      if(st==="na"||st==="opt"||f.t==="key") continue;
      sm.req++; req++;
      if(st==="ok") done++; else sm.items.push({f,st});
    }
    out.push(sm);
  }
  return {sections:out,req,done,miss:req-done};
}

const normId=s=>String(s||"").trim().replace(/\s+/g," ");
function keyOf(id){
  const s=normId(id).toUpperCase(); let o="";
  for(const ch of s){
    if(/[A-Za-z0-9_\-:@+]/.test(ch)) o+=ch;
    else for(const b of new TextEncoder().encode(ch)) o+="~"+b.toString(16).padStart(2,"0");
  }
  return o.slice(0,190)||"_";
}
const LS="sems-crf-mau15-v1";
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const store={mode:"loading",docs:new Map(),listeners:[]};
function emit(){for(const fn of store.listeners) fn();}
async function initStore(){
  let db=null;
  /* bản mẫu: luôn lưu trên trình duyệt, tách khỏi dữ liệu thật */
  if(db){
    store.mode="db"; store.db=db; const col=db.collection("patients");
    store.col=col;
    col.onSnapshot(snap=>{
      const m=new Map(); for(const d of snap.docs) m.set(d.id,d.data());
      if(q.pending&&m.has(q.key)) m.set(q.key,deepMerge(clone(m.get(q.key)),q.pending));
      store.docs=m; store.ready=true; emit();
    },err=>{ setSave("Mất kết nối kho dữ liệu ("+err.code+"). Tải lại trang để kết nối lại.",true); });
    store.create=(k,body)=>col.doc(k).set(body);
    store.patch=(k,p)=>col.doc(k).update(p);
    store.remove=k=>col.doc(k).delete();
  }else{
    store.mode="local";
    let obj={}; try{obj=JSON.parse(ls.get(LS)||"{}")}catch(e){}
    store.docs=new Map(Object.entries(obj)); store.ready=true;
    if(!store.docs.size&&!ls.get(LS+"-seeded")){ const now=Date.now(); SAMPLES.forEach((x,i)=>{ const id="MAU-"+String(i+1).padStart(3,"0"), t=new Date(now-(SAMPLES.length-i)*3600e3).toISOString();
      store.docs.set(keyOf(id),{study_id:id,medical_record:"HS"+(24100+i*137),baseline:clone(x.baseline),followup:clone(x.followup),created:t,updated:t,sample:true}); });
      ls.set(LS,JSON.stringify(Object.fromEntries(store.docs))); ls.set(LS+"-seeded","1"); }
    const persist=()=>{ls.set(LS,JSON.stringify(Object.fromEntries(store.docs)));emit();};
    store.create=async(k,body)=>{store.docs.set(k,body);persist();};
    store.patch=async(k,p)=>{const d=store.docs.get(k); if(d){store.docs.set(k,deepMerge(clone(d),p));persist();}};
    store.remove=async k=>{store.docs.delete(k);persist();};
    emit();
  }
}
const clone=o=>JSON.parse(JSON.stringify(o));
function deepMerge(a,b){for(const k in b){const v=b[k]; if(v&&typeof v==="object"&&!Array.isArray(v)&&a[k]&&typeof a[k]==="object"&&!Array.isArray(a[k])) deepMerge(a[k],v); else a[k]=v;} return a;}

/* write queue: coalesce edits per patient, one write in flight */
const q={pending:null,key:null,timer:null,busy:false};
function queuePatch(k,p){
  if(q.key&&q.key!==k) flush();
  q.key=k; q.pending=deepMerge(q.pending||{},p);
  setSave("Đang lưu…"); clearTimeout(q.timer); q.timer=setTimeout(flush,600);
}
async function flush(){
  clearTimeout(q.timer);
  if(q.busy||!q.pending) return;
  const k=q.key,p=q.pending; q.pending=null; q.busy=true;
  p.updated=new Date().toISOString();
  try{ await store.patch(k,p); setSave("Đã lưu "+new Date().toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"})); }
  catch(e){ q.pending=deepMerge(p,q.pending||{}); setSave("Chưa lưu được ("+(e&&e.code||"lỗi")+"). Sẽ thử lại khi bạn sửa tiếp.",true); }
  q.busy=false;
  if(q.pending) flush();
}

  if(prevPage!==st.page&&!["baseline","followup"].includes(prevPage)) st.prev=prevPage;

/* horizontal strips (top tabs, section rail, settings menu): wheel and mouse-drag scroll sideways */
(()=>{ let el=null,x0=0,s0=0,moved=false;
  const strip=t=>t&&t.closest&&t.closest("nav.tabs,.rail,.setnav");
  document.addEventListener("wheel",e=>{ const n=strip(e.target); if(n&&Math.abs(e.deltaY)>Math.abs(e.deltaX)&&n.scrollWidth>n.clientWidth){ n.scrollLeft+=e.deltaY; e.preventDefault(); } },{passive:false});
  document.addEventListener("pointerdown",e=>{ if(e.pointerType!=="mouse") return; el=strip(e.target); moved=false; if(el){ x0=e.clientX; s0=el.scrollLeft; } });
  window.addEventListener("pointermove",e=>{ if(!el) return; const dx=e.clientX-x0; if(Math.abs(dx)>4){ moved=true; el.classList.add("drag"); } if(moved) el.scrollLeft=s0-dx; });
  window.addEventListener("pointerup",()=>{ if(el) el.classList.remove("drag"); el=null; });
  document.addEventListener("click",e=>{ if(moved&&strip(e.target)){ e.preventDefault(); e.stopPropagation(); } moved=false; },true);
  document.getElementById("tabs").addEventListener("click",()=>{ navIntent=true; });
})();

function renderStrip(){
  const d=curDoc();
  let h="";
  if(store.mode==="local") h+=`<span class="notice">BẢN MẪU 15 hồ sơ để tìm hiểu các mục. Dữ liệu chỉ lưu trên trình duyệt này, không ảnh hưởng dữ liệu thật.</span>`;
  if(d){
    const b=missing(d,"baseline"),f=missing(d,"followup");
    h+=`<div class="who"><span class="hint">Đang mở:</span><b>${esc(d.study_id)}</b><span class="hint">Số hồ sơ ${esc(d.medical_record||"—")}</span>
      <span class="tag ${b.miss?"in":"ok"}">Baseline: ${b.miss?b.miss+" mục thiếu":"đủ"}</span>
      <span class="tag ${f.miss?"in":"ok"}">Follow-up: ${f.miss?f.miss+" mục thiếu":"đủ"}</span></div>
      <button class="btn sm" data-act="switch" style="margin-left:auto">Đổi bệnh nhân</button>`;
  }else if(store.ready){
    h+=`<span class="hint">Chưa mở hồ sơ bệnh nhân nào.</span>`;
  }
  $strip.innerHTML=h;
}

function render(){
  if(!store.ready||!auth.users) return;
  if(!st.user){ renderGate(st.gateMsg); st.gateMsg=null; return; }
  setChrome(true); document.getElementById("uname").textContent=dispName(st.user);
  renderStrip(); renderCrumb();
  const p=st.page;
  if(p==="trangchu") renderHome();
  else if(p==="caidat") renderSettings();
  else if(p==="danhsach") renderList();
  else if(p==="theodoi") renderTrack();
  else renderForm(p);
  renderModal();
  document.documentElement.style.setProperty("--hdr",document.querySelector("header.bar").offsetHeight+"px");
}

const logoSvg=()=>`<img src="${LOGO_URI}" alt="" width="384" height="384">`;
for(const el of document.querySelectorAll("[data-logo]")) el.innerHTML=logoSvg();
const enc=s=>new TextEncoder().encode(s);
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function hashPw(pw,salt){
  const key=await crypto.subtle.importKey("raw",enc(pw),"PBKDF2",false,["deriveBits"]);
  return b64(await crypto.subtle.deriveBits({name:"PBKDF2",salt:b64d(salt),iterations:150000,hash:"SHA-256"},key,256));
}
const newSalt=()=>b64(crypto.getRandomValues(new Uint8Array(16)));
const normUser=u=>String(u||"").trim().toLowerCase();
const auth={users:null};
async function loadAccounts(){
  if(store.mode==="db"){ const s=await store.db.doc("settings/accounts").get(); auth.users=s.exists?(s.data().users||{}):{}; }
  else { try{auth.users=JSON.parse(ls.get("sems-crf-mau15-accounts")||"{}")}catch(e){auth.users={};} if(!Object.keys(auth.users).length) auth.users={"duongsang":{"display":"DuongSang","fullName":"DƯƠNG THỊ NGỌC SANG","salt":"yiDkQ8pqdIrsdb34/TJDSQ==","hash":"8J0fnrE0Bn1IeyvQXhTKVt9tF7/Co9tsmKTGtRCwLOc=","created":"2026-10-26T11:56:52.332899Z","idleMin":15}}; }
}
async function saveAccounts(users){
  if(store.mode==="db") await store.db.doc("settings/accounts").set({users,updated:new Date().toISOString()});
  else ls.set("sems-crf-mau15-accounts",JSON.stringify(users));
  auth.users=users;
}
const ss={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},del(k){try{sessionStorage.removeItem(k)}catch(e){}}};
function restoreSession(){
  let s=null; try{s=JSON.parse(ss.get("sems-crf-auth")||ls.get("sems-crf-auth")||"null")}catch(e){}
  const a=s&&auth.users[s.u];
  if(a&&a.hash.slice(0,24)===s.h){
    const last=Number(ls.get("sems-crf-last")||0), lim=idleMin(s.u);
    if(lim&&last&&Date.now()-last>lim*60000){ ss.del("sems-crf-auth"); ls.set("sems-crf-auth",""); st.gateMsg=`Đã tự đăng xuất do không sử dụng quá ${lim} phút.`; return; }
    st.user=s.u; touch();
  }
}
/* auto logout after inactivity */
const idleMin=u=>{const a=auth.users&&auth.users[u]; const v=a&&a.idleMin; return v===0?0:(v||15);};
let lastAct=Date.now(), lastSaved=0;
function touch(){ lastAct=Date.now(); if(lastAct-lastSaved>20000){ lastSaved=lastAct; ls.set("sems-crf-last",String(lastAct)); } }
for(const ev of ["pointerdown","keydown","wheel","touchstart","scroll","mousemove"]) window.addEventListener(ev,()=>{ if(st.user) touch(); },{passive:true});
setInterval(()=>{
  if(!st.user) return; const lim=idleMin(st.user);
  if(lim&&Date.now()-lastAct>lim*60000){ st.gateMsg=`Đã tự đăng xuất do không sử dụng quá ${lim} phút.`; logout(); }
},15000);
const dispName=u=>{const a=auth.users&&auth.users[u]; return (a&&a.display)||u;};
function keepSession(u,remember){
  const v=JSON.stringify({u,h:auth.users[u].hash.slice(0,24)});
  ss.set("sems-crf-auth",v); if(remember) ls.set("sems-crf-auth",v);
}
async function saveFile(filename,data){
  let dl=null; try{ dl=window.claude&&await window.claude.use("downloads"); }catch(e){}
  if(dl) return dl.save({filename,data});
  const url=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));
  const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}
function logout(){ setCur(null); st.user=null; st.modal=null; if(st.exp) closeExport(); ss.del("sems-crf-auth"); ls.set("sems-crf-auth",""); location.hash="trangchu"; render(); }
function setChrome(on){ for(const id of ["bar","strip-band","crumb"]) document.getElementById(id).hidden=!on; }
function renderCrumb(){
  const el=document.getElementById("crumb"), p=st.page, d=isForm(p)?curDoc():null;
  const path=[["trangchu","Trang chủ"]]; if(p!=="trangchu") path.push([p,PNAME[p]]);
  const canBack=st.depth>0||p!=="trangchu";
  el.innerHTML=`${canBack?`<button class="btn sm backbtn" data-act="hback" aria-label="Quay lại trang trước"><span aria-hidden="true">←</span> Quay lại</button>`:""}
    <nav class="crumbs" aria-label="Vị trí">${path.map(([k,t],i)=>i<path.length-1||d?`<a href="#${k}" data-act="crumb" data-to="${k}">${t}</a><span class="sep" aria-hidden="true">›</span>`:`<b>${t}</b>`).join("")}${d?`<b class="mono">${esc(d.study_id)}</b>`:""}</nav>`;
}

function renderGate(msg){
  setChrome(false); document.getElementById("modal").innerHTML="";
  const first=!Object.keys(auth.users||{}).length;
  $main.innerHTML=`<div class="gate"><div class="card gatecard">
    <span class="logo gl">${logoSvg()}</span><div class="gbrand">Sổ CRF SEMS<small>Nghiên cứu kết quả trung hạn và tái can thiệp sau đặt stent kim loại đường mật</small></div>
    ${first?`<h1>Thiết lập tài khoản lần đầu</h1><p class="sub">Chưa có tài khoản nào. Đặt tên đăng nhập và mật khẩu để khóa ứng dụng.</p>`:`<h1>Đăng nhập</h1>`}
    <form id="${first?"setup":"login"}" class="gform" autocomplete="on">
      <label>Tên đăng nhập<input type="text" id="g-u" autocomplete="username" required autocapitalize="none" spellcheck="false"></label>
      <label>Mật khẩu<input type="password" id="g-p" autocomplete="${first?"new-password":"current-password"}" required ${first?'minlength="6"':""}></label>
      ${first?`<label>Nhập lại mật khẩu<input type="password" id="g-p2" autocomplete="new-password" required></label>`:`<label class="toggle"><input type="checkbox" id="g-r"> Ghi nhớ đăng nhập trên máy này</label>`}
      <div class="gerr" id="g-err" role="alert">${esc(msg||"")}</div>
      <button class="btn pri" type="submit">${first?"Tạo tài khoản và vào ứng dụng":"Đăng nhập"}</button>
    </form></div></div>`;
  setTimeout(()=>{const i=document.getElementById("g-u"); i&&i.focus();},0);
}
document.addEventListener("submit",async e=>{
  const id=e.target.id; if(!["login","setup","acct-pw","acct-add","acct-info","acct-reset"].includes(id)) return;
  e.preventDefault();
  const err=t=>{const el=e.target.querySelector(".gerr"); if(el) el.textContent=t;};
  const btn=e.target.querySelector("button[type=submit]"); btn.disabled=true;
  try{
    await loadAccounts();
    if(id==="login"){
      const u=normUser(document.getElementById("g-u").value), p=document.getElementById("g-p").value, a=auth.users[u];
      if(!a||await hashPw(p,a.salt)!==a.hash){ err("Tên đăng nhập hoặc mật khẩu không đúng."); return; }
      st.user=u; touch(); keepSession(u,document.getElementById("g-r").checked); setCur(null); setChrome(true); location.hash="trangchu"; route();
    }else if(id==="setup"){
      const u=normUser(document.getElementById("g-u").value), p=document.getElementById("g-p").value;
      if(Object.keys(auth.users).length){ renderGate("Đã có tài khoản. Vui lòng đăng nhập."); return; }
      if(!/^[a-z0-9._-]{3,32}$/.test(u)){ err("Tên đăng nhập 3–32 ký tự, chỉ gồm chữ không dấu, số, dấu chấm, gạch."); return; }
      if(p.length<6){ err("Mật khẩu tối thiểu 6 ký tự."); return; }
      if(p!==document.getElementById("g-p2").value){ err("Hai lần nhập mật khẩu không khớp."); return; }
      const salt=newSalt();
      await saveAccounts({[u]:{display:document.getElementById("g-u").value.trim(),salt,hash:await hashPw(p,salt),created:new Date().toISOString(),idleMin:15}});
      st.user=u; keepSession(u,false); setCur(null); setChrome(true); location.hash="trangchu"; route();
    }else if(id==="acct-info"){
      const a=auth.users[st.user], raw=document.getElementById("i-u").value.trim(), u=normUser(raw), fn=document.getElementById("i-fn").value.trim();
      if(!a||await hashPw(document.getElementById("i-p").value,a.salt)!==a.hash){ err("Mật khẩu hiện tại không đúng."); return; }
      if(!/^[a-z0-9._-]{3,32}$/.test(u)){ err("Tên đăng nhập 3–32 ký tự, chỉ gồm chữ không dấu, số, dấu chấm, gạch."); return; }
      if(u!==st.user&&auth.users[u]){ err("Tên đăng nhập này đã có."); return; }
      const users=clone(auth.users); delete users[st.user]; users[u]={...a,display:raw,fullName:fn};
      await saveAccounts(users); const remember=!!ls.get("sems-crf-auth"); st.user=u; keepSession(u,remember); setSave("Đã lưu thông tin tài khoản"); render();
    }else if(id==="acct-pw"){
      const a=auth.users[st.user], o=document.getElementById("a-old").value, n=document.getElementById("a-new").value;
      if(!a||await hashPw(o,a.salt)!==a.hash){ err("Mật khẩu hiện tại không đúng."); return; }
      if(n.length<6){ err("Mật khẩu mới tối thiểu 6 ký tự."); return; }
      if(n!==document.getElementById("a-new2").value){ err("Hai lần nhập mật khẩu mới không khớp."); return; }
      const salt=newSalt(), users=clone(auth.users); users[st.user]={...a,salt,hash:await hashPw(n,salt)};
      await saveAccounts(users); keepSession(st.user,!!ls.get("sems-crf-auth")); setSave("Đã đổi mật khẩu"); renderSettings();
    }else if(id==="acct-reset"){
      const u=e.target.dataset.u, n=document.getElementById("r-p").value;
      if(!auth.users[u]){ err("Tài khoản không còn tồn tại."); return; }
      if(n.length<6){ err("Mật khẩu tối thiểu 6 ký tự."); return; }
      const salt=newSalt(), users=clone(auth.users); users[u]={...users[u],salt,hash:await hashPw(n,salt)};
      await saveAccounts(users); st.resetUser=null; setSave("Đã đặt lại mật khẩu cho "+(users[u].display||u)); renderSettings();
    }else if(id==="acct-add"){
      const u=normUser(document.getElementById("n-u").value), p=document.getElementById("n-p").value;
      if(!/^[a-z0-9._-]{3,32}$/.test(u)){ err("Tên đăng nhập 3–32 ký tự, chỉ gồm chữ không dấu, số, dấu chấm, gạch."); return; }
      if(auth.users[u]){ err("Tên đăng nhập này đã có."); return; }
      if(p.length<6){ err("Mật khẩu tối thiểu 6 ký tự."); return; }
      const salt=newSalt(), users=clone(auth.users); users[u]={display:document.getElementById("n-u").value.trim(),fullName:document.getElementById("n-fn").value.trim(),salt,hash:await hashPw(p,salt),created:new Date().toISOString(),idleMin:15};
      await saveAccounts(users); setSave("Đã thêm tài khoản "+u); renderSettings();
    }
  }catch(ex){ err("Không lưu được ("+(ex&&ex.code||ex&&ex.message||"lỗi")+"). Chỉ chủ sở hữu hoặc người có quyền chỉnh sửa trang mới thay đổi được tài khoản."); }
  finally{ btn.disabled=false; }

function renderHome(){
  const all=[...store.docs.entries()].map(([k,d])=>({k,d,b:missing(d,"baseline"),f:missing(d,"followup")}));

async function logoPng(){
  const img=new Image(); img.src=LOGO_URI;
  await img.decode(); const c=document.createElement("canvas"); c.width=c.height=384; const g=c.getContext("2d");
  g.beginPath(); g.roundRect(0,0,384,384,84); g.clip(); g.drawImage(img,0,0,384,384);
  return await new Promise(r=>c.toBlob(r,"image/png"));
}

/* ---------------- record summary (dialog + lookup) ---------------- */
function recForms(k){
  const d=store.docs.get(k); if(!d) return "";
  return `<div class="recforms">${["baseline","followup"].map(form=>{const m=missing(d,form), pct=m.req?Math.floor(m.done/m.req*100):0, full=!m.miss;
    return `<div class="recf"><h3>Phiếu ${FORMS[form].title}</h3>
    <div class="pctrow"><span class="pct${full?" full":""}">${pct}%</span><span class="q">đã nhập (${m.done}/${m.req} mục)</span></div>
    <div class="pbar${full?" full":""}"><div style="width:${pct}%"></div></div>
    <div class="q">${full?"Đã nhập đủ, không còn mục nào thiếu.":`Còn thiếu <b>${100-pct}%</b> (${m.miss} mục)${firstMiss(m)?`, mục thiếu đầu tiên: <b>${esc(firstMiss(m).f.l)}</b>`:""}.`}</div>
    <div class="acts">${full?"":`<button class="btn pri" data-act="resume" data-k="${k}" data-to="${form}">Bổ sung tiếp phần thiếu</button>`}
    <button class="btn" data-act="start" data-k="${k}" data-to="${form}">Xem lại từ đầu</button></div></div>`;}).join("")}</div>`;
}
const firstMiss=m=>{for(const s of m.sections) if(s.items.length) return s.items[0]; return null;};
function recPct(d){const b=missing(d,"baseline"),f=missing(d,"followup");return Math.floor((b.done+f.done)/Math.max(1,b.req+f.req)*100);}
function renderModal(){
  const el=document.getElementById("modal");
  if(st.dup){ el.innerHTML=dupHTML(); return; }
  const d=st.modal&&store.docs.get(st.modal);
  if(!d){el.innerHTML="";return;}
  const p=recPct(d);
  el.innerHTML=`<div class="modal" data-act="mclose-bg"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-t">
    <header><div><h2 id="dlg-t" class="mono" style="font-size:18px">${esc(d.study_id)}</h2><span class="hint">Số hồ sơ ${esc(d.medical_record||"—")} · cập nhật ${esc(fmtTime(d.updated))}</span></div><button class="x" data-act="mclose" aria-label="Đóng">×</button></header>
    <p class="lead">Hồ sơ này đã đạt <b>${p}%</b> nhập liệu, còn thiếu <b>${100-p}%</b>. Bạn muốn xem lại từ đầu hay bổ sung tiếp phần thiếu?</p>
    ${recForms(st.modal)}</div></div>`;
}
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape") return;
  if(st.dup){st.dup=null;st.lookup=null;render();return;}
  if(st.modal){st.modal=null;renderModal();return;}
  const t=e.target; if(t.id==="search"&&st.search){st.search="";render();} else if(t.id==="tsearch"&&st.tsearch){st.tsearch="";render();} else if(t.closest&&t.closest("#lookup")&&st.lookup){st.lookup=null;render();}
});

}

async function makeSamples(){
  const now=Date.now(), used=new Set([...store.docs.values()].map(d=>String(d.medical_record||"")));
  const made=[];
  for(let i=0;i<SAMPLES.length;i++){
    const id=nextId(); let mr; do{ mr="HS"+(20000+Math.floor(Math.random()*79999)); }while(used.has(mr)); used.add(mr);
    const t=new Date(now-(SAMPLES.length-i)*3600e3).toISOString();
    const body={study_id:id,medical_record:mr,baseline:clone(SAMPLES[i].baseline),followup:clone(SAMPLES[i].followup),created:t,updated:t,sample:true};
    const key=keyOf(id); await store.create(key,body); store.docs.set(key,body); made.push(id);
  }
  return made;
}
function nextId(){
  let n=0; for(const d of store.docs.values()){const m=/^MAU-(\d+)$/i.exec(normId(d.study_id||"")); if(m) n=Math.max(n,+m[1]);}
  let id; do{ n++; id="MAU-"+String(n).padStart(3,"0"); }while(store.docs.has(keyOf(id)));
  return id;
}
function findMatches(id,mr){
  const out=[]; const MR=normId(mr).toUpperCase();
  if(id){const k=keyOf(id); if(store.docs.has(k)) out.push({k,by:"định danh"});}
  if(MR) for(const [k,d] of store.docs) if(normId(d.medical_record).toUpperCase()===MR){const ex=out.find(x=>x.k===k); if(ex) ex.by="định danh và số hồ sơ"; else out.push({k,by:"số hồ sơ"});}
  return out;
}
async function createRecord(id,mr){
  const key=keyOf(id), now=new Date().toISOString();
  const body={study_id:id,medical_record:mr||"",baseline:{},followup:{},created:now,updated:now};
  try{ await store.create(key,body); store.docs.set(key,body); setCur(key); st.lookup=null; setSave("Đã tạo hồ sơ mới "+id);
    go(st.page==="followup"?"followup":"baseline"); }
  catch(err){ setSave("Không tạo được hồ sơ ("+(err&&err.code||"lỗi")+").",true); }
}
function dupHTML(){
  const D=st.dup; const ms=D.matches.map(m=>({...m,d:store.docs.get(m.k)})).filter(m=>m.d);
  return `<div class="modal" data-act="dup-no-bg"><div class="dlg warn" role="alertdialog" aria-modal="true" aria-labelledby="dup-t">
    <header><div><h2 id="dup-t">⚠ Hồ sơ này đã có</h2></div><button class="x" data-act="dup-no" aria-label="Đóng">×</button></header>
    <div class="dupbody"><p class="lead" style="padding:0">Hồ sơ / định danh này đã có, bạn <b>không thể tạo hồ sơ mới</b>. Bạn có muốn kiểm tra lại không?</p>
    <ul class="duplist">${ms.map(m=>`<li><span><b class="mono">${esc(m.d.study_id)}</b> · Số hồ sơ ${esc(m.d.medical_record||"—")}<br><span class="hint">Trùng theo ${m.by} · đã nhập ${recPct(m.d)}% · cập nhật ${esc(fmtTime(m.d.updated))}</span></span>
      <button class="btn pri" data-act="dup-yes" data-k="${m.k}">Có, mở hồ sơ${ms.length>1?" này":""}</button></li>`).join("")}</ul>
    <div class="actions"><button class="btn" data-act="dup-no">Không, thoát</button></div></div></div></div>`;
}
function missBlock(name,m,form){
  if(!m.miss) return `<div><h3>${name}</h3><span class="tag ok">Đã nhập đủ ${m.req} mục</span></div>`;
  const secs=m.sections.filter(s=>s.items.length);
  return `<div><h3>${name}: còn thiếu ${m.miss}/${m.req} mục</h3><ul>${secs.map(s=>`<li><b>${s.id}. ${esc(s.t)}</b> (${s.items.length}): ${s.items.slice(0,6).map(i=>`<a href="#${form}" data-act="jump" data-form="${form}" data-k="${i.f.k}">${esc(i.f.l)}</a>`).join(", ")}${s.items.length>6?`, … và ${s.items.length-6} mục khác`:""}</li>`).join("")}</ul></div>`;
}

function meter(m){const pct=m.req?Math.round(m.done/m.req*100):0;return `<div class="meter"><div class="track"><div class="fill${pct===100?" full":""}" style="width:${pct}%"></div></div><span>${m.done}/${m.req}</span></div>`;}
function ptDone(d,ctx){ return isForm(ctx)?!missing(d,ctx).miss:!missing(d,"baseline").miss&&!missing(d,"followup").miss; }
function fcards(ctx,link){
  const docs=[...store.docs.values()], n=docs.length, nd=docs.filter(d=>ptDone(d,ctx)).length, f=st.pf||"all";
  const what=isForm(ctx)?"phiếu "+FORMS[ctx].title:"cả Baseline và Follow-up";
  const c=(v,cls,num,lbl,sub)=>`<button class="fcard ${cls}" data-act="pf" data-v="${v}"${link?` data-to="danhsach"`:""} aria-pressed="${!link&&f===v}"><span class="fi" aria-hidden="true"></span><b>${num}</b><span class="fl">${lbl}</span><span class="fs">${sub}</span></button>`;
  return `<div class="fcards">${c("all","all",n,"Tất cả hồ sơ","bấm để xem toàn bộ")}${c("done","done",nd,"Đầy đủ","đã nhập đủ "+what)}${c("miss","miss",n-nd,"Còn thiếu","còn mục chưa nhập, chưa chọn")}</div>`;
}
function ptRows(ctx){

function bar(m,label){const pct=m.req?Math.round(m.done/m.req*100):0;return `<div class="mbar"><span class="ml">${label}</span><div class="track"><div class="fill${pct===100?" full":""}" style="width:${pct}%"></div></div><span class="mc ${m.miss?"m":"z"}">${m.miss?m.miss+" thiếu":"đủ"}</span></div>`;}

function byPatient(all){

function patientPanel(x){

function byQuestion(all){
  const F=st.trackForm, rows=[];

    for(const x of all){const v=vals(x.d,F), stt=fieldState(f,v); if(stt==="na"||stt==="opt") continue; app++; if(stt!=="ok") who.push(x);}
    if(who.length) rows.push({s,f,who,app});
  }
  rows.sort((a,b)=>b.who.length/b.app-a.who.length/a.app||b.who.length-a.who.length);
  return `<div class="toolbar"><div class="seg" role="group" aria-label="Phiếu"><button data-act="tform" data-f="baseline" aria-pressed="${F==="baseline"}">Baseline</button><button data-act="tform" data-f="followup" aria-pressed="${F==="followup"}">Follow-up</button></div><span class="hint">${rows.length} câu hỏi đang thiếu ở ít nhất một bệnh nhân, xếp theo tỷ lệ thiếu cao nhất.</span></div>

  ${rows.map(r=>{const pct=Math.round(r.who.length/r.app*100);return `<tr><td class="mono">${r.s.id}</td><td><b>${esc(r.f.l)}</b><br><code class="hint">[${r.f.k}]</code></td>
  <td class="num"><div class="qmeter"><div class="track"><div class="fill warn" style="width:${pct}%"></div></div><span>${r.who.length}/${r.app}</span></div></td>
  <td><div class="fchips">${r.who.map(x=>`<a href="#${F}" class="fchip pt" data-act="jump" data-pk="${x.k}" data-form="${F}" data-k="${r.f.k}">${esc(x.d.study_id)}</a>`).join("")}</div></td></tr>`;}).join("")}
  </tbody></table></div>`:`<div class="card empty"><b>Không còn câu hỏi nào bị thiếu</b>Tất cả bệnh nhân đã nhập đủ phiếu ${FORMS[F].title}.</div>`}`;

function fieldHTML(f,v){
  const id="f-"+f.k, x=v[f.k];
  let ctl="";
  if(f.t==="key") ctl=`<div class="readonly">${esc(v.study_id)}</div>`;
  else if(f.t==="radio"||f.t==="multi"){
    const arr=f.t==="multi"?(Array.isArray(x)?x:[]):[x];
    const opts=f.other?[...f.o,OTHER]:f.o;
    ctl=`<div class="chips" role="group" aria-labelledby="${id}-l">${opts.map(o=>`<button type="button" class="chip${f.t==="multi"?" multi":""}" data-k="${f.k}" data-v="${esc(o)}" aria-pressed="${arr.includes(o)}">${esc(o===OTHER?"Mục khác…":o)}</button>`).join("")}</div>`;
    if(f.other) ctl+=`<input type="text" class="othertxt" id="${id}-o" data-k="${f.k}_other" placeholder="Ghi rõ mục khác" value="${esc(v[f.k+"_other"]||"")}">`;
  }
  else if(f.t==="num") ctl=`<div class="numrow"><input type="number" step="any" inputmode="decimal" id="${id}" data-k="${f.k}" value="${esc(x==null?"":x)}">${f.u?`<span class="unit">${esc(f.u)}</span>`:""}</div>`;
  else if(f.t==="date") ctl=`<input type="date" id="${id}" data-k="${f.k}" value="${esc(x||"")}">`;
  else if(f.t==="area") ctl=`<textarea id="${id}" data-k="${f.k}">${esc(x||"")}</textarea>`;
  else ctl=`<input type="text" id="${id}" data-k="${f.k}" value="${esc(f.top?v[f.k]||"":x||"")}" style="width:100%">`;
  const labTag=(f.t==="radio"||f.t==="multi"||f.t==="key")?`<span class="lab" id="${id}-l">${esc(f.l)}</span>`:`<label for="${id}">${esc(f.l)}</label>`;
  return `<div class="fld${f.wide?" wide":""}" data-f="${f.k}">
    <div class="fh">${labTag}<code>[${f.k}]</code><span class="tag" data-tag></span></div>
    ${f.hint?`<div class="hint">${esc(f.hint)}</div>`:""}${ctl}</div>`;
}
function refreshForm(){
  const form=$main.dataset.form, F=FORMS[form], d=curDoc();
  if(!F||!d||!document.getElementById("form")) return;
  const v=vals(d,form), m=missing(d,form);
  for(const s of F.sections){
    let lastGroup=null, groupVisible=false;
    const flush=()=>{if(lastGroup) lastGroup.hidden=!groupVisible;};
    const sec=document.getElementById(`sec-${form}-${s.id}`);
    for(const el of sec.querySelectorAll(".fields>*")){
      if(el.hasAttribute("data-group")){flush(); lastGroup=el; groupVisible=false; continue;}
      const f=s.fields.find(x=>x.k===el.dataset.f), state=fieldState(f,v);
      el.hidden=state==="na"; if(state!=="na") groupVisible=true;
      const bad=["in","ch","ot"].includes(state);
      el.classList.toggle("miss",bad); if(!bad) el.classList.remove("target");
      const t=el.querySelector("[data-tag]");
      t.className="tag"+(bad?(state==="ch"?" ch":" in"):""); t.textContent=bad?STL[state]:state==="opt"?"không bắt buộc":"";
      t.hidden=!t.textContent;
      const o=el.querySelector(".othertxt");
      if(o){const x=v[f.k]; o.hidden=!(x===OTHER||(Array.isArray(x)&&x.includes(OTHER)));}
    }
    flush();
    const sm=m.sections.find(x=>x.id===s.id);
    sec.querySelector("[data-cnt]").innerHTML=sm.items.length?`<span class="tag in">${sm.items.length}/${sm.req} còn thiếu</span>`:`<span class="tag ok">Đủ ${sm.req} mục</span>`;
  }
  document.getElementById("rail").innerHTML=m.sections.map(s=>`<a href="#${form}" data-act="sec" data-s="${s.id}">${s.id}. ${esc(s.t)} <span class="n ${s.items.length?"m":"z"}">${s.items.length||"✓"}</span></a>`).join("");
  renderStrip();
}
/* sync field values from store when another device changes them, skipping the focused field */
function syncValues(){
  const form=$main.dataset.form, d=curDoc(); if(!d||!document.getElementById("form")) return;
  const v=vals(d,form);
  for(const el of $main.querySelectorAll("input[data-k],textarea[data-k]")){
    if(el===document.activeElement) continue;
    const nv=v[el.dataset.k]; const s=nv==null?"":String(nv); if(el.value!==s) el.value=s;
  }
  for(const b of $main.querySelectorAll(".chip")){
    const x=v[b.dataset.k]; const on=Array.isArray(x)?x.includes(b.dataset.v):x===b.dataset.v;
    b.setAttribute("aria-pressed",on);
  }
  refreshForm();
}
function setVal(k,val){
  const form=$main.dataset.form, d=curDoc(); if(!d) return;
  const local=clone(d);
  if(k==="medical_record"){ local.medical_record=val; store.docs.set(st.cur,local); queuePatch(st.cur,{medical_record:val}); }
  else{
    local[form]=local[form]||{}; local[form][k]=val;
    const p={[form]:{[k]:val}};
    if(form==="baseline"&&(k==="height_cm"||k==="weight_kg")){
      const h=Number(local.baseline.height_cm), w=Number(local.baseline.weight_kg);
      if(h>0&&w>0){ const bmi=Math.round(w/((h/100)**2)*10)/10; local.baseline.bmi=bmi; p.baseline.bmi=bmi; const el=document.getElementById("f-bmi"); if(el) el.value=bmi; }
    }
    store.docs.set(st.cur,local); queuePatch(st.cur,p);
  }
  refreshForm();
}

/* ---------------- events ---------------- */
document.addEventListener("submit",e=>{
  if(e.target.id!=="lookup") return; e.preventDefault();
  const id=normId(document.getElementById("lk-id").value), mr=normId(document.getElementById("lk-mr").value);
  if(!id&&!mr){ st.lookup={status:"empty"}; render(); return; }
  const m=findMatches(id,mr);
  if(m.length){ st.lookup={id,mr,status:"dup"}; st.dup={matches:m}; render(); return; }
  createRecord(id||nextId(),mr);
});
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act],.chip"); if(!b) return;
  if(b.classList.contains("chip")&&!b.dataset.act){
    const form=$main.dataset.form, d=curDoc(); const f=FORMS[form].sections.flatMap(s=>s.fields).find(x=>x.k===b.dataset.k);
    const cur=(d[form]||{})[f.k], val=b.dataset.v;
    if(f.t==="multi"){const a=Array.isArray(cur)?[...cur]:[]; const i=a.indexOf(val); i>=0?a.splice(i,1):a.push(val); setVal(f.k,a.length?a:null); b.setAttribute("aria-pressed",i<0);}
    else{const on=cur!==val; setVal(f.k,on?val:null); for(const c of b.parentNode.children) c.setAttribute("aria-pressed",on&&c===b);}
    if(val===OTHER&&b.getAttribute("aria-pressed")==="true"){const o=b.closest(".fld").querySelector(".othertxt"); o&&o.focus();}
    return;
  }
  const a=b.dataset.act;
  if(a==="open-existing"){ e.preventDefault(); setCur(st.lookup.key); st.lookup=null; go(b.dataset.to); }
  else if(a==="cancel-lookup"){ st.lookup=null; render(); }
  else if(a==="newauto"){ const mr=normId(document.getElementById("lk-mr").value), m=mr?findMatches("",mr):[];
    if(m.length){ st.lookup={id:"",mr,status:"dup"}; st.dup={matches:m}; render(); } else createRecord(nextId(),mr); }
  else if(a==="dup-yes"){ st.dup=null; st.lookup=null; st.modal=b.dataset.k; render(); }
  else if(a==="dup-no"||(a==="dup-no-bg"&&e.target===b)){ st.dup=null; st.lookup=null; render(); }
  else if(a==="clrsearch"){ st[b.dataset.s]=""; render(); }
  else if(a==="pf"){ st.pf=b.dataset.v; if(b.dataset.to){ st.pfKeep=true; go(b.dataset.to); } else render(); }
  else if(a==="pfclear"){ st.pf="all"; st.search=""; render(); }
  else if(a==="hback"){ if(st.depth>0) history.back(); else if(isForm(st.page)&&st.cur){ setCur(null); go(st.page); } else go(st.page==="trangchu"?"trangchu":isForm(st.page)?"danhsach":"trangchu"); }
  else if(a==="back"){ const to=st.prev&&st.prev!==st.page?st.prev:"danhsach"; setCur(null); go(to); }
  else if(a==="switch"){ setCur(null); st.lookup=null; if(st.page==="theodoi") go("danhsach"); else if(isForm(st.page)) go(st.page); else { syncTabs(); render(); } }
  else if(a==="open"){ setCur(b.dataset.k); st.lookup=null; go(b.dataset.to); }
  else if(a==="crumb"){ e.preventDefault(); if(b.dataset.to===st.page&&isForm(st.page)) setCur(null); go(b.dataset.to); }
  else if(a==="track"){ st.sel=b.dataset.k; st.tmode="pt"; go("theodoi"); }
  else if(a==="del"){ st.confirmDel=b.dataset.k; render(); }
  else if(a==="del-no"){ st.confirmDel=null; render(); }
  else if(a==="del-yes"){ const k=b.dataset.k; st.confirmDel=null; try{ await store.remove(k); store.docs.delete(k); if(st.cur===k) setCur(null); setSave("Đã xóa hồ sơ"); }catch(err){ setSave("Không xóa được ("+(err&&err.code||"lỗi")+").",true);} render(); }
  else if(a==="tform"){ st.trackForm=b.dataset.f; render(); }
  else if(a==="tmode"){ st.tmode=b.dataset.m; render(); }
  else if(a==="tfilter"){ st.tfilter=b.dataset.v; render(); }
  else if(a==="tsel"){ st.sel=b.dataset.k; render(); if(window.innerWidth<=900){const d=document.getElementById("pdetail"); d&&d.scrollIntoView({behavior:"smooth"});} }
  else if(a==="sec"){ e.preventDefault(); const el=document.getElementById(`sec-${$main.dataset.form}-${b.dataset.s}`); el&&el.scrollIntoView({behavior:"smooth"}); }
  else if(a==="jump"){
    e.preventDefault();
    if(b.dataset.pk) setCur(b.dataset.pk);
    else if(st.lookup){ setCur(st.lookup.key); st.lookup=null; }
    st.onlyMiss=false; st.focusAfter=b.dataset.k; go(b.dataset.form);
  }
  else if(a==="rec"){ st.modal=b.dataset.k; renderModal(); }
  else if(a==="mclose"||(a==="mclose-bg"&&e.target===b)){ st.modal=null; renderModal(); }
  else if(a==="resume"||a==="start"){ e.preventDefault(); setCur(b.dataset.k); st.lookup=null; st.modal=null; st.onlyMiss=false;
    if(a==="resume") st.focusAfter="first"; else st.focusAfter=null;
    if(a==="start") window.scrollTo(0,0); go(b.dataset.to); }
  else if(a==="xopen") openExport(b.dataset.from);
  else if(a==="logout") logout();
  else if(a==="setgo"){ e.preventDefault(); for(const x of b.parentNode.children) x.classList.toggle("on",x===b); const el=document.getElementById("set-"+b.dataset.s); el&&el.scrollIntoView({behavior:"smooth",block:"start"}); }
  else if(a==="idle"){ const v=Number(b.dataset.v);
    try{ await loadAccounts(); const users=clone(auth.users); users[st.user].idleMin=v; await saveAccounts(users); touch(); setSave(v?`Sẽ tự đăng xuất sau ${v} phút không sử dụng`:"Đã tắt tự đăng xuất"); }
    catch(err){ setSave("Không lưu được cài đặt ("+(err&&err.code||"lỗi")+").",true); }
    renderSettings(); }
  else if(a==="ureset"){ st.resetUser=b.dataset.u; st.confirmUser=null; renderSettings(); const i=document.getElementById("r-p"); i&&i.focus(); }
  else if(a==="ureset-no"){ st.resetUser=null; renderSettings(); }
  else if(a==="logo-dl"){
    try{ await saveFile("logo-so-crf-sems.png",await logoPng()); setSave("Đã tải logo"); }catch(err){ if(err&&err.code!=="declined") setSave("Không tải được logo ("+(err.code||"lỗi")+").",true); } }
  else if(a==="mkmau"){ b.disabled=true; try{ const m=await makeSamples(); setSave(`Đã tạo ${m.length} hồ sơ mẫu ${m[0]} – ${m[m.length-1]}`); }catch(err){ setSave("Không tạo được hồ sơ mẫu ("+(err&&err.code||"lỗi")+").",true); } render(); }
  else if(a==="rmmau"){ st.confirmMau=true; renderSettings(); }
  else if(a==="rmmau-no"){ st.confirmMau=false; renderSettings(); }
  else if(a==="rmmau-yes"){ st.confirmMau=false; let n=0; try{ for(const [k,d] of [...store.docs.entries()]) if(d.sample){ await store.remove(k); store.docs.delete(k); if(st.cur===k) setCur(null); n++; } setSave(`Đã xóa ${n} hồ sơ mẫu`); }catch(err){ setSave("Không xóa được ("+(err&&err.code||"lỗi")+").",true); } render(); }
  else if(a==="udel"){ st.confirmUser=b.dataset.u; renderSettings(); }
  else if(a==="udel-no"){ st.confirmUser=null; renderSettings(); }
  else if(a==="udel-yes"){ st.confirmUser=null; try{ await loadAccounts(); const users=clone(auth.users); delete users[b.dataset.u]; await saveAccounts(users); setSave("Đã xóa tài khoản"); }catch(err){ setSave("Không xóa được tài khoản ("+(err&&err.code||"lỗi")+").",true);} renderSettings(); }
});
const timers={};
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="search"){ st.search=t.value; const box=document.getElementById("ptbox"); if(box) box.innerHTML=ptRows(box.dataset.ctx); return; }
  if(t.id==="tsearch"){ st.tsearch=t.value; const pos=t.selectionStart; render(); const n=document.getElementById("tsearch"); n.focus(); n.setSelectionRange(pos,pos); return; }
  if(!t.dataset.k||!$main.contains(t)||!document.getElementById("form")) return;
  let val=t.value; if(t.type==="number") val=val===""?null:Number(val); else if(val==="") val=null;
  setVal(t.dataset.k,val);
});
document.addEventListener("change",async e=>{

  if(e.target.id==="onlymiss"){ st.onlyMiss=e.target.checked; document.getElementById("form").classList.toggle("onlymiss",st.onlyMiss); }
});

const othTxt=(f,v,o)=>o===OTHER?"Khác: "+(v[f.k+"_other"]||"…"):o;
function fmtVal(f,v){
  const x=v[f.k]; if(isEmpty(x)) return null;
  if(f.t==="date") return fmtDate(x);
  if(f.t==="num") return String(x).replace(".",",")+(f.u?" "+f.u:"");
  if(f.t==="multi") return (Array.isArray(x)?x:[x]).map(o=>othTxt(f,v,o)).join("; ");
  if(f.t==="radio") return othTxt(f,v,x);
  return String(x);
}
/* raw value for statistics: numbers stay numbers, dates become dates, "Mục khác" goes to its own column */
function statVal(f,v){
  const x=v[f.k]; if(isEmpty(x)) return null;
  if(f.t==="num"){const n=Number(x); return isNaN(n)?String(x):n;}
  if(f.t==="date"){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(x); return m?new Date(Date.UTC(+m[1],m[2]-1,+m[3])):x;}
  if(f.t==="multi") return (Array.isArray(x)?x:[x]).map(o=>o===OTHER?"Khác":o).join("; ");
  if(f.t==="radio") return x===OTHER?"Khác":x;
  return String(x);
}

function tableModel(){

  cols.push({h:"Định danh",code:"study_id",get:d=>d.study_id,raw:d=>d.study_id});
  cols.push({h:"Số hồ sơ",code:"medical_record",get:d=>d.medical_record||"",raw:d=>d.medical_record||null});
  for(const form of forms) for(const s of FORMS[form].sections) if(E.secs[form].has(s.id)) for(const f of s.fields){
    if(f.t==="key"||f.top) continue;
    const pre=two?(form==="baseline"?"BL ":"FU "):"", cpre=form==="baseline"?"bl_":"fu_";
    const cell=(d,raw)=>{const v=vals(d,form),stt=fieldState(f,v); if(stt==="na") return raw?null:"";
      const x=raw?statVal(f,v):fmtVal(f,v); if(x==null) return E.empty==="mark"?emptyTxt(stt==="opt"?"in":stt):(raw?null:""); return x;};
    cols.push({h:pre+s.id+". "+f.l+(f.u?" ("+f.u+")":""),q:f.l+(f.u?" ("+f.u+")":""),code:cpre+f.k,f,form,sec:s,get:d=>cell(d,false),raw:d=>cell(d,true)});
    if(f.other) cols.push({h:pre+s.id+". "+f.l+" – ghi rõ mục khác",q:f.l+" – ghi rõ mục khác",code:cpre+f.k+"_other",f,form,sec:s,other:1,
      get:d=>{const v=vals(d,form);return v[f.k+"_other"]||"";},raw:d=>{const v=vals(d,form);return v[f.k+"_other"]||null;}});
  }
  if(forms.includes("baseline")) cols.push({h:"% Baseline đã nhập",code:"bl_pct",get:d=>recFormPct(d,"baseline")+"%",raw:d=>recFormPct(d,"baseline")});
  if(forms.includes("followup")) cols.push({h:"% Follow-up đã nhập",code:"fu_pct",get:d=>recFormPct(d,"followup")+"%",raw:d=>recFormPct(d,"followup")});

async function buildPdf(){
  await loadLib("jspdf"); await loadLib("autotable");
  const E=st.exp, doc=new window.jspdf.jsPDF({orientation:E.orient,unit:"mm",format:"a4"}), title=E.title||expDefaultTitle();
  doc.addFileToVFS("LS-R.ttf",FONT_R); doc.addFont("LS-R.ttf","LS","normal");
  doc.addFileToVFS("LS-B.ttf",FONT_B); doc.addFont("LS-B.ttf","LS","bold");
  const W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight(), fz=E.size, teal=[14,107,98];
  const header=y=>{ doc.setFont("LS","bold"); doc.setFontSize(fz+4); doc.setTextColor(20); const t=doc.splitTextToSize(nfc(title),W-28); doc.text(t,14,y); y+=t.length*(fz+4)*0.42+2;
    if(E.note){ doc.setFont("LS","normal"); doc.setFontSize(fz); doc.setTextColor(90); const n=doc.splitTextToSize(nfc(E.note),W-28); doc.text(n,14,y); y+=n.length*fz*0.42+2; } return y; };
  const base={font:"LS",fontSize:fz,cellPadding:1.6,lineColor:[200,205,204],lineWidth:0.15,textColor:20,overflow:"linebreak"};
  if(E.kind==="bang"){
    const T=tableModel(), y=header(16);
    doc.autoTable({startY:y,head:[T.cols.map(c=>nfc(T.head(c)))],body:T.pts.map(d=>T.cols.map(c=>nfc(c.get(d)))),styles:{...base,fontSize:Math.max(6,fz-2)},headStyles:{font:"LS",fontStyle:"bold",fillColor:teal,textColor:255},margin:{left:10,right:10},horizontalPageBreak:true,horizontalPageBreakRepeat:0});
  }else{
    patientModel().forEach((p,i)=>{
      if(i) doc.addPage();
      let y=header(16);
      doc.setFont("LS","normal"); doc.setFontSize(fz); doc.setTextColor(20);
      doc.text(nfc(`Định danh: ${p.d.study_id}    Số hồ sơ: ${p.d.medical_record||"—"}    Đã nhập: ${recPct(p.d)}%`),14,y); y+=fz*0.42+3;
      for(const fm of p.forms){
        if(y>H-30){doc.addPage(); y=16;}
        doc.setFont("LS","bold"); doc.setFontSize(fz+1); doc.setTextColor(...teal);
        const t=doc.splitTextToSize(nfc(FORMS[fm.form].full),W-28); doc.text(t,14,y); y+=t.length*(fz+1)*0.42+3;
        const body=[];
        for(const s of fm.sections){ body.push([{content:nfc(s.id+". "+s.t),colSpan:2,styles:{fontStyle:"bold",fillColor:hexRgb(SECFILL[s.id]),textColor:[30,40,40]}}]);
          for(const r of s.rows) body.push([nfc(r.f.l+(E.codes?" ["+r.f.k+"]":"")),{content:nfc(r.val),styles:r.miss?{textColor:[163,90,0]}:{}}]); }
        doc.autoTable({startY:y,body,styles:base,columnStyles:{0:{cellWidth:(W-28)*0.48}},margin:{left:14,right:14},theme:"grid"});
        y=doc.lastAutoTable.finalY+6;
      }
    });
  }
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFont("LS","normal"); doc.setFontSize(8); doc.setTextColor(120); doc.text(nfc(`Trang ${i}/${n} · Xuất ngày ${new Date().toLocaleDateString("vi-VN")}`),W-14,H-8,{align:"right"}); }
  return doc.output("blob");
}
async function buildDocx(){
  await loadLib("jszip");
  const E=st.exp, sz=E.size*2, title=E.title||expDefaultTitle(), x=s=>nfc(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const rpr=o=>`<w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/>${o.b?"<w:b/>":""}${o.c?`<w:color w:val="${o.c}"/>`:""}<w:sz w:val="${o.sz||sz}"/></w:rPr>`;
  const run=(t,o={})=>`<w:r>${rpr(o)}<w:t xml:space="preserve">${x(t)}</w:t></w:r>`;
  const para=(t,o={})=>`<w:p><w:pPr><w:spacing w:after="${o.after??80}"/>${o.pb?'<w:pageBreakBefore/>':""}${o.fill?`<w:shd w:val="clear" w:color="auto" w:fill="${o.fill}"/>`:""}${o.ind?`<w:ind w:left="${o.ind}"/>`:""}${o.keep?"<w:keepNext/>":""}</w:pPr>${Array.isArray(t)?t.map(r=>run(r[0],r[1]||{})).join(""):run(t,o)}</w:p>`;
  const land=E.orient==="landscape", pw=land?16838:11906, ph=land?11906:16838, usable=pw-1440;
  const cell=(t,o={})=>`<w:tc><w:tcPr><w:tcW w:w="${o.w||0}" w:type="${o.w?"dxa":"auto"}"/>${o.span?`<w:gridSpan w:val="${o.span}"/>`:""}${o.fill?`<w:shd w:val="clear" w:color="auto" w:fill="${o.fill}"/>`:""}</w:tcPr><w:p><w:pPr><w:spacing w:after="0"/></w:pPr>${run(t,o)}</w:p></w:tc>`;
  const tbl=(rows,grid,hdr)=>`<w:tbl><w:tblPr><w:tblW w:w="${usable}" w:type="dxa"/><w:tblBorders>${["top","left","bottom","right","insideH","insideV"].map(b=>`<w:${b} w:val="single" w:sz="4" w:color="C8CDCC"/>`).join("")}</w:tblBorders><w:tblCellMar><w:left w:w="80" w:type="dxa"/><w:right w:w="80" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${grid.map(g=>`<w:gridCol w:w="${g}"/>`).join("")}</w:tblGrid>${rows.map((r,i)=>`<w:tr>${i===0&&hdr?'<w:trPr><w:tblHeader/></w:trPr>':""}${r}</w:tr>`).join("")}</w:tbl>`;
  const meta=p=>para(`Định danh: ${p.d.study_id}    Số hồ sơ: ${p.d.medical_record||"—"}    Đã nhập: ${recPct(p.d)}%`);
  let body="";
  if(E.kind==="bang"){
    const T=tableModel(), n=T.cols.length, w=Math.floor(usable/n);
    body=para(title,{b:1,sz:sz+8,after:60})+(E.note?para(E.note,{c:"5C6967"}):"");
    body+=tbl([T.cols.map(c=>cell(T.head(c),{b:1,fill:"0E6B62",c:"FFFFFF",w,sz:sz-4})).join(""),...T.pts.map(d=>T.cols.map(c=>cell(c.get(d),{w,sz:sz-4})).join(""))],T.cols.map(()=>w),true);
  }else if(E.kind==="vanban"){
    patientModel().forEach((p,i)=>{
      body+=para(title,{c:"5C6967",sz:sz-2,after:40,pb:i>0})+para("Bệnh nhân "+p.d.study_id,{b:1,sz:sz+12,after:60})+meta(p);
      for(const fm of p.forms){
        body+=para(FORMS[fm.form].full,{b:1,c:"0E6B62",sz:sz+2,after:80,keep:1});
        for(const s of fm.sections){
          body+=para(s.id+". "+s.t,{b:1,fill:SECFILL[s.id],after:60,keep:1});
          body+=s.rows.map(r=>para([[r.f.l+(E.codes?" ["+r.f.k+"]":"")+": "],[r.val||"—",{b:1,c:r.miss?"A35A00":undefined}]],{ind:240,after:40})).join("")||para("Không có câu hỏi áp dụng.",{ind:240,c:"A35A00"});
        }
      }
    });
  }else{
    const w1=Math.round(usable*0.48), w2=usable-w1;
    patientModel().forEach((p,i)=>{
      body+=para(title,{b:1,sz:sz+8,after:60,pb:i>0})+(E.note?para(E.note,{c:"5C6967"}):"")+meta(p);
      for(const fm of p.forms){
        body+=para(FORMS[fm.form].full,{b:1,c:"0E6B62",sz:sz+2,after:60});
        const rows=[];
        for(const s of fm.sections){ rows.push(cell(s.id+". "+s.t,{b:1,fill:SECFILL[s.id],span:2,w:usable}));
          for(const r of s.rows) rows.push(cell(r.f.l+(E.codes?" ["+r.f.k+"]":""),{w:w1})+cell(r.val,{w:w2,c:r.miss?"A35A00":undefined})); }

      }

  }

  const z=new window.JSZip();
  z.file("[Content_Types].xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`);

  z.file("word/document.xml",docXml);
  return await z.generateAsync({type:"blob",compression:"DEFLATE",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}
document.addEventListener("click",e=>{

    if(o==="kind"){ E.fmt=KINDS[v].fmts[0]; if(v==="bang"){E.orient="landscape"; if(E.empty==="hide") E.empty="blank";} else E.orient="portrait"; }
    renderExp(); }

    E.pts=new Set(v==="all"?keys:v==="none"?[]:v==="cur"?[st.cur]:keys.filter(k=>{const d=store.docs.get(k);return missing(d,"baseline").miss||missing(d,"followup").miss;})); renderExp(); }

  else if(a==="xgo") doExport();
});
